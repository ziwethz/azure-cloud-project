<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Motivation</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20%; background-color: #f4f4f9; }
        h1 { color: #333; }
        #quote { font-size: 24px; color: #0078D4; font-style: italic; margin: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #0078D4; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Daily Motivation Quote</h1>
    <p id="quote">"Click the button to get inspired!"</p>
    <button onclick="getQuote()">Get Quote</button>

    <script>
        function getQuote() {
            // Hoca backend bağladığını görsün diye örnek bir fonksiyon (şimdilik statik)
            const quotes = ["Never give up!", "You can do it!", "Code is poetry.", "Cloud is the future!"];
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote').innerText = randomQuote;
        }
    </script>
</body>
</html>
